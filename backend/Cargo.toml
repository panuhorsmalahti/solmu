[package]
name = "solmu-backend"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
tokio-util = { version = "0.7", features = ["rt"] }
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["ws"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
genai = "0.6.5"
glob = "0.3.3"
regex = "1.13.1"
rmcp = { version = "3.4.1", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
walkdir = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util", "fs"] }
uuid = { version = "1.26.1", features = ["v4"] }
tower-http = { version = "0.6.11", features = ["fs"] }
cron = "0.17.0"
chrono = "0.4.45"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
