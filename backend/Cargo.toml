[package]
name = "solmu-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio-util = { version = "0.7", features = ["rt"] }
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["ws"] }
dotenvy = "0.15.7"
futures-util = "0.3.34"
genai = "0.6.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
uuid = { version = "1.26.1", features = ["v4"] }
