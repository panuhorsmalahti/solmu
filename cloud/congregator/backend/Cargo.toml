[package]
name = "solmu-congregator"
version = "0.1.3"
edition = "2024"
license.workspace = true

[[bin]]
name = "congregator"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
dotenvy = "0.15.7"
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.2" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.6.11", features = ["fs", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
