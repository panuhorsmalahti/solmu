[package]
name = "solmu-muxer"
version = "0.1.2"
edition = "2024"
license.workspace = true

[[bin]]
name = "muxer"
path = "src/main.rs"

[dependencies]
crossterm = { version = "0.29", features = ["serde"] }
ratatui = "0.30.2"
portable-pty = "0.9"
vt100 = "0.16"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
toml_edit = "0.25.15"
regex = "1.13.1"
base64 = "0.22.1"
solmu-client = { path = "../clients/common" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem"] }
