name: Publish Docker image

on:
  push:
    branches: [main]
    paths: ['backend/**', 'Cargo*', 'Dockerfile', '.dockerignore', 'clients/**/Cargo.toml', 'e2e/**', 'sandbox/**', '.github/workflows/container.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/panuhorsmalahti/solmu:${{ inputs.tag || 'latest' }}
            ghcr.io/panuhorsmalahti/solmu:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/panuhorsmalahti/solmu
            org.opencontainers.image.title=Solmu
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
