name: Publish Docker image

on:
  push:
    branches: [main]
    paths: ['backend/**', 'Cargo*', 'Dockerfile', '.dockerignore', 'clients/**/Cargo.toml', 'muxer/Cargo.toml', 'e2e/**', 'boxer/**', '.github/workflows/container.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        type: string
        default: latest
      version:
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        if: inputs.version != ''
        with:
          node-version: '24'
      - name: Set release version in container build metadata
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release.mjs stamp
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/panuhorsmalahti/solmu:${{ inputs.tag || 'latest' }}
            ghcr.io/panuhorsmalahti/solmu:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/panuhorsmalahti/solmu
            org.opencontainers.image.title=Solmu
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the published backend container
        env:
          IMAGE: ghcr.io/panuhorsmalahti/solmu:${{ inputs.tag || 'latest' }}
        run: sh e2e/api/docker-smoke.sh "$IMAGE"
