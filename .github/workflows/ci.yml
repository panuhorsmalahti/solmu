name: Build, lint, and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  installers:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright test --config e2e/install/playwright.config.ts
      - run: npx playwright test --config e2e/releases/playwright.config.ts

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev bubblewrap
          # GitHub's disposable runner needs unprivileged namespaces for isolation tests.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - if: runner.os != 'Linux'
        run: cargo test --workspace --all-targets --locked
      - name: macOS sandbox failure diagnostics
        if: failure() && runner.os == 'macOS'
        continue-on-error: true
        run: |
          sudo /usr/bin/log show --last 5m --style compact \
            --predicate 'eventMessage CONTAINS "deny(" AND (eventMessage CONTAINS "sandbox-probe" OR eventMessage CONTAINS "solmu-backend" OR eventMessage CONTAINS "boxer")'
          python3 e2e/support/macos_diagnostics.py
      - if: runner.os == 'Linux'
        run: |
          # Delegate a private hierarchy; test processes live in its supervisor leaf.
          sudo systemd-run --wait --pipe --collect \
            -p User="$USER" -p WorkingDirectory="$PWD" \
            -p Delegate=yes -p DelegateSubgroup=supervisor \
            /usr/bin/env "PATH=$PATH" cargo test --workspace --all-targets --locked
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-backend
          path: |
            target/debug/solmu-backend
            target/debug/fixture
          retention-days: 2

  browser:
    name: Web and website
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run build:web
      - uses: actions/download-artifact@v4
        with:
          name: browser-test-backend
          path: target/debug
      - run: chmod +x target/debug/solmu-backend target/debug/fixture
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
