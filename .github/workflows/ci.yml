name: Build, lint, and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ios:
    name: iOS (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: brew install xcodegen
      - run: xcodegen generate --spec project.yml
        working-directory: clients/ios
      - name: Build and test the native iOS app
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for group in data["devices"].values() for device in group if device["isAvailable"] and device["name"].startswith("iPhone")))')"
          xcodebuild test \
            -project clients/ios/Solmu.xcodeproj \
            -scheme Solmu \
            -destination "platform=iOS Simulator,id=$device_id" \
            -parallel-testing-enabled NO \
            -maximum-concurrent-test-simulator-destinations 1 \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            -resultBundlePath "$RUNNER_TEMP/Solmu.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          xcrun simctl boot "$device_id" 2>/dev/null || true
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" "$RUNNER_TEMP/ios-build/Build/Products/Debug-iphonesimulator/Solmu.app"
          xcrun simctl launch --terminate-running-process "$device_id" org.solmu.ios --uitesting --backend http://solmu.test --screenshot
          sleep 3
          mkdir -p docs/screenshots
          xcrun simctl io "$device_id" screenshot docs/screenshots/ios.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-client-screenshot
          path: docs/screenshots/ios.png
          if-no-files-found: ignore

  muxer-gui:
    name: Muxer GUI (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libfontconfig1-dev xvfb xdotool imagemagick
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p solmu-cli -p solmu-muxer-gui
      - run: xvfb-run -a -s '-screen 0 1180x760x24' bash e2e/muxer-gui/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: muxer-gui-screenshot
          path: |
            docs/screenshots/muxer-gui.png
            docs/screenshots/muxer-gui-worktrees.png
            docs/screenshots/muxer-gui-remove-worktree.png
            docs/screenshots/muxer-gui-tab-context-menu.png
            docs/screenshots/muxer-gui-pane-context-menu.png
            docs/screenshots/muxer-gui-pane-close-after.png
            docs/screenshots/muxer-gui-terminal-input-after.png

  android:
    name: Android (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p clients/android assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: false
          script: |
            set -eu
            gradle -p clients/android connectedDebugAndroidTest
            adb install -r clients/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.solmu.android/.MainActivity
            sleep 3
            mkdir -p docs/screenshots
            adb exec-out screencap -p > docs/screenshots/android.png
            test -s docs/screenshots/android.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-client-screenshot
          path: docs/screenshots/android.png
          if-no-files-found: ignore

  installers:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright test --config e2e/install/playwright.config.ts
      - run: npx playwright test --config e2e/releases/playwright.config.ts

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev bubblewrap libdbus-1-dev strace
          # GitHub's disposable runner needs unprivileged namespaces for isolation tests.
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - if: runner.os != 'Linux'
        run: cargo test --workspace --all-targets --locked
      - name: macOS sandbox failure diagnostics
        if: failure() && runner.os == 'macOS'
        continue-on-error: true
        run: |
          sudo /usr/bin/log show --last 5m --style compact \
            --predicate 'eventMessage CONTAINS "deny(" AND (eventMessage CONTAINS "sandbox-probe" OR eventMessage CONTAINS "solmu-backend" OR eventMessage CONTAINS "boxer")'
          python3 e2e/support/macos_diagnostics.py
      - if: runner.os == 'Linux'
        run: |
          # Delegate a private hierarchy; test processes live in its supervisor leaf.
          sudo systemd-run --wait --pipe --collect \
            -p User="$USER" -p WorkingDirectory="$PWD" \
            -p Delegate=yes -p DelegateSubgroup=supervisor \
            /usr/bin/env "PATH=$PATH" cargo test --workspace --all-targets --locked
      - if: runner.os == 'Linux'
        run: |
          sudo systemd-run --wait --pipe --collect \
            -p User="$USER" -p WorkingDirectory="$PWD" \
            -p Delegate=yes -p DelegateSubgroup=supervisor \
            /usr/bin/env "PATH=$PATH" SOLMU_CAPTURE_SCREENSHOTS=1 \
            cargo test --locked -p solmu-e2e --test desktop screenshots::desktop_main_screen_screenshot -- --exact
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-client-screenshot
          path: docs/screenshots/desktop.png
          if-no-files-found: ignore
          retention-days: 2
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-backend
          path: |
            target/debug/solmu-backend
            target/debug/fixture
            target/debug/mcp-fixture
          retention-days: 2

  boxer-arm64:
    name: Boxer supervisor (Linux ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libdbus-1-dev
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p solmu-boxer
      - run: cargo build --locked -p solmu-e2e --bin sandbox-probe
      - run: |
          sudo systemd-run --wait --pipe --collect \
            -p User="$USER" -p WorkingDirectory="$PWD" \
            -p Delegate=yes -p DelegateSubgroup=supervisor \
            /usr/bin/env "PATH=$PATH" \
            cargo test --locked -p solmu-e2e --test boxer supervisor:: -- --test-threads=1

  browser:
    name: Web and website
    needs: [rust, ios, android, muxer-gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: ios-client-screenshot
          path: docs/screenshots
      - uses: actions/download-artifact@v4
        with:
          name: android-client-screenshot
          path: docs/screenshots
      - uses: actions/download-artifact@v4
        with:
          name: muxer-gui-screenshot
          path: docs/screenshots
      - uses: actions/download-artifact@v4
        with:
          name: desktop-client-screenshot
          path: docs/screenshots
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:web
      - run: npm run build:web
      - uses: actions/download-artifact@v4
        with:
          name: browser-test-backend
          path: target/debug
      - run: chmod +x target/debug/solmu-backend target/debug/fixture target/debug/mcp-fixture
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx playwright test --config e2e/congregator/playwright.config.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
