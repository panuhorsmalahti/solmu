name: Production release

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z), matching the version committed in Cargo.toml'
        required: true
        default: '0.1.0'

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - id: version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs plan
  quality:
    needs: validate
    if: needs.validate.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  native:
    needs: [validate, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - runner: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Set the release version in build metadata
        if: github.event_name == 'schedule'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/release.mjs stamp
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev libdbus-1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }} -p solmu-backend -p solmu-cli -p solmu-desktop -p solmu-boxer -p solmu-boxer-gui -p solmu-muxer -p solmu-muxer-gui
      - name: Package Unix executables
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          tar -C "target/$TARGET/release" -czf "artifacts/solmu-v$VERSION-$PLATFORM.tar.gz" solmu-backend solmu solmu-desktop boxer boxer-gui muxer muxer-gui
      - name: Package Windows executables
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory artifacts | Out-Null
          $binaries = @('solmu-backend.exe', 'solmu.exe', 'solmu-desktop.exe', 'boxer.exe', 'boxer-gui.exe', 'muxer.exe', 'muxer-gui.exe') | ForEach-Object { Join-Path "target/$env:TARGET/release" $_ }
          Compress-Archive -LiteralPath $binaries -DestinationPath "artifacts/solmu-v$env:VERSION-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/*

  web:
    needs: [validate, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Set the release version in build metadata
        if: github.event_name == 'schedule'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/release.mjs stamp
      - run: npm run build:web
      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir artifacts
          cd clients/web/dist
          zip -r "../../../artifacts/solmu-v$VERSION-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: artifacts/*

  android:
    needs: [validate, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Set the ANDROID_KEYSTORE_BASE64 repository secret.' >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/solmu-android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/solmu-android/release.jks"
      - name: Build signed Android release APK
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          SOLMU_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/solmu-android/release.jks
          SOLMU_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SOLMU_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SOLMU_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" && test -n "$ANDROID_STORE_PASSWORD" || { echo 'Set ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, and ANDROID_STORE_PASSWORD repository secrets.' >&2; exit 1; }
          version_code="$(node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major > 999 || minor > 999 || patch > 999) process.exit(1); process.stdout.write(String(major * 1000000 + minor * 1000 + patch))' "$VERSION")"
          gradle -p clients/android assembleRelease -PsolmuVersionName="$VERSION" -PsolmuVersionCode="$version_code"
          mkdir artifacts
          cp clients/android/app/build/outputs/apk/release/app-release.apk "artifacts/solmu-v$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: artifacts/*

  container:
    needs: [validate, native, web]
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: v${{ needs.validate.outputs.version }}
      version: ${{ needs.validate.outputs.version }}

  publish:
    needs: [validate, native, web, android, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Collect commit changelog
        env:
          PREVIOUS_TAG: ${{ needs.validate.outputs.previous }}
        run: node scripts/release.mjs notes
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release with automatic changelog
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum solmu-* > SHA256SUMS
          gh release create "v$VERSION" solmu-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Solmu v$VERSION" --notes "$(cat release-notes.md)" --generate-notes
