name: Production release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (X.Y.Z), matching the version committed in Cargo.toml'
        required: true
        default: '0.1.0'

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          expected = os.environ['VERSION']
          for path in ['backend', 'clients/cli', 'clients/desktop', 'sandbox', 'muxer']:
              data = tomllib.loads(Path(path, 'Cargo.toml').read_text())
              assert data['package']['version'] == expected, f'Bump {path}/Cargo.toml to {expected} before releasing'
          PY
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"; then
            echo 'This release tag already exists.' >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
  quality:
    needs: validate
    uses: ./.github/workflows/ci.yml

  native:
    needs: [validate, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - runner: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libfontconfig1-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }} -p solmu-backend -p solmu-cli -p solmu-desktop -p solmu-sandbox -p solmu-muxer
      - name: Package Unix executables
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p artifacts
          tar -C "target/$TARGET/release" -czf "artifacts/solmu-v$VERSION-$PLATFORM.tar.gz" solmu-backend solmu-cli solmu-desktop sandbox muxer
      - name: Package Windows executables
        if: runner.os == 'Windows'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory artifacts | Out-Null
          $binaries = @('solmu-backend.exe', 'solmu-cli.exe', 'solmu-desktop.exe', 'sandbox.exe', 'muxer.exe') | ForEach-Object { Join-Path "target/$env:TARGET/release" $_ }
          Compress-Archive -LiteralPath $binaries -DestinationPath "artifacts/solmu-v$env:VERSION-windows-x86_64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/*

  web:
    needs: [validate, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mkdir artifacts
          cd clients/web/dist
          zip -r "../../../artifacts/solmu-v$VERSION-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: artifacts/*

  container:
    needs: [validate, native, web]
    uses: ./.github/workflows/container.yml
    permissions:
      contents: read
      packages: write
    with:
      tag: v${{ needs.validate.outputs.version }}

  publish:
    needs: [validate, native, web, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum solmu-* > SHA256SUMS
          gh release create "v$VERSION" ./* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Solmu v$VERSION" --generate-notes
