[package]
name = "solmu-boxer"
version = "0.1.3"
edition = "2024"
license.workspace = true

[[bin]]
name = "boxer"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
hex = "0.4.3"
sha2 = "0.10.9"
ring = "0.17.14"
tempfile = "3"
uuid = { version = "1.26.1", features = ["v4"] }
walkdir = "2.5.0"
rpassword = "7.4.0"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
libc = "0.2"
keyring = { version = "3.6.3", default-features = false, features = ["crypto-rust", "sync-secret-service"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
