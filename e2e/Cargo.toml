[package]
name = "solmu-e2e"
version = "0.1.2"
edition = "2024"
license.workspace = true

[dependencies]
base64 = "0.22.1"
chrono = "0.4.45"
portable-pty = "0.9"
iced_test = "0.14.0"
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "tokio", "fira-sans"] }
png = "0.18"
solmu-client = { path = "../clients/common" }
solmu-desktop = { path = "../clients/desktop" }
vt100 = "0.16"
async-stream = "0.3.6"
axum = "0.8.9"
eventsource-stream = "0.2.3"
futures-util = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
hex = "0.4.3"
ring = "0.17.14"
tempfile = "3"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tokio-tungstenite = "0.29"

[[test]]
name = "api"
path = "api/mod.rs"

[[test]]
name = "cli"
path = "cli/mod.rs"

[[test]]
name = "desktop"
path = "desktop/mod.rs"

[[test]]
name = "boxer"
path = "boxer/mod.rs"

[[test]]
name = "muxer"
path = "muxer/mod.rs"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
