name: Solmu
options:
  bundleIdPrefix: org.solmu
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Solmu:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.solmu.ios
    info:
      properties:
        CFBundleDisplayName: Solmu
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Connect to your Solmu backend on your local network.
        UILaunchScreen: {}
  SolmuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../../e2e/ios
    dependencies:
      - target: Solmu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.solmu.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Solmu:
    build:
      targets:
        Solmu: all
        SolmuUITests: [test]
    test:
      targets:
        - SolmuUITests
