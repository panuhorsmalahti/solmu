[package]
name = "solmu-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true

[[bin]]
name = "solmu"
path = "src/main.rs"

[dependencies]
solmu-client = { path = "../common" }
dotenvy = "0.15.7"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3.34"
serde_json = "1"
uuid = { version = "1.26.1", features = ["v4"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
